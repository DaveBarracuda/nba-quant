# Ejecuta el modelo a demanda: proyecta los partidos de una fecha, imprime en el log la tabla por
# partido vs la línea del mercado y guarda los picks (modelo sin mezcla vs línea actual de ESPN) en
# ledger/github/. Con "blend" sólo se imprime: el ledger registra el modelo sin mezcla.
# El lake se construye desde ESPN y se guarda en la caché de Actions: la primera corrida descarga
# 2024-25 → hoy (lenta); las siguientes sólo los partidos nuevos.
name: Ejecutar modelo

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Fecha de los partidos (AAAA-MM-DD). Vacío = hoy (hora del Este)"
        required: false
        default: ""
      blend:
        description: "Mezclar modelo y línea de cierre (ajuste previo, ~5 min)"
        type: boolean
        default: false

permissions:
  contents: write  # guarda los picks en ledger/github/

concurrency:
  group: ledger  # misma cola que "Liquidar ledger": nunca escriben el ledger a la vez
  cancel-in-progress: false

env:
  LAKE_START: "2024-10-01"  # temporadas 2024-25 y 2025-26 (+ pretemporada 2026-27): base de priors y Kalman
  PYTHONUNBUFFERED: "1"

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Instalar
        run: pip install -e . -c constraints.txt

      - name: Base del NBA Odds Tracker
        # rama `data` del repo del tracker (corre en Actions); sin ella se usan las líneas de ESPN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/tracker
          url="https://api.github.com/repos/DaveBarracuda/nba-odds-tracker/contents/odds.sqlite3?ref=data"
          if curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" -o data/tracker/odds.sqlite3 "$url"; then
            echo "NBA_ODDS_TRACKER_DB=$PWD/data/tracker/odds.sqlite3" >> "$GITHUB_ENV"
            ls -l data/tracker/odds.sqlite3
          else
            echo "::warning::No se pudo descargar la base del tracker; se usan las líneas de ESPN"
          fi

      - name: Restaurar lake
        id: lake
        uses: actions/cache/restore@v4
        with:
          path: data/lake
          key: lake-${{ github.run_id }}
          restore-keys: lake-

      - name: Ingesta inicial (sólo sin caché)
        if: steps.lake.outputs.cache-matched-key == ''
        run: python -m nba_quant.cli ingest --start "$LAKE_START" --season-types 1 2 3 --with-rosters

      - name: Ingesta incremental
        if: steps.lake.outputs.cache-matched-key != ''
        run: python -m nba_quant.cli ingest --season-types 1 2 3

      - name: Guardar lake
        uses: actions/cache/save@v4
        with:
          path: data/lake
          key: lake-${{ github.run_id }}

      - name: Ejecutar modelo
        env:
          INPUT_DATE: ${{ inputs.date }}
          BLEND: ${{ inputs.blend && '--blend' || '' }}
        run: |
          set -o pipefail  # que un fallo del modelo no quede oculto por `tee`
          DATE="${INPUT_DATE:-$(TZ=America/New_York date +%F)}"
          echo "Partidos del $DATE"
          start=$(date +%s)
          python -m nba_quant.cli simulate --date "$DATE" $BLEND --record-picks | tee simulate.log
          echo "Tiempo de simulación: $(( $(date +%s) - start )) s"
          {
            echo "## Proyección por partido — $DATE"
            echo '```'
            sed -n '/PROYECCIÓN POR PARTIDO/,$p' simulate.log
            echo '```'
            MD="data/reports/market_vs_model_${DATE}.md"  # picks por movimiento del mercado (ESPN)
            if [ -f "$MD" ]; then cat "$MD"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar picks en el ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger/github/
          if git diff --cached --quiet; then
            echo "Sin picks nuevos para el ledger"
            exit 0
          fi
          git commit -m "chore(ledger): picks del workflow $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Subir tear sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-${{ github.run_id }}
          path: |
            simulate.log
            data/reports/
          if-no-files-found: ignore
          retention-days: 14
