[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-quant"
version = "0.1.0"
description = "NBA quantitative inference engine: PBP features, Bayesian team strength, possession Markov Monte Carlo, market edge."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "duckdb>=0.10",
    "pyarrow>=14",
    "requests>=2.31",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
nba_api = ["nba_api>=1.4"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
nba-quant = "nba_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
